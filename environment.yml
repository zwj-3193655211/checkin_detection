# 晨读晨练签到检测系统 - Conda 环境配置
# 创建: conda env create -f environment.yml
# 激活: conda activate checkin_detection
#
# 说明:
# - 当前专属环境中 python 由 conda 提供 (3.10)，其余全部由 pip 安装（torch/torchvision
#   也是 pip 装入，非 conda 包），因此这里只在 pip 段声明依赖。
# - 当前环境 torch 为 CPU 版 (2.11.0+cpu)。如需完全一致地复现 CPU 版，创建环境后用：
#     pip install torch==2.11.0 --index-url https://download.pytorch.org/whl/cpu
#   否则默认会拉到 CUDA 版（有 GPU 时更合适）。
# - Pillow 必须用 pip 安装（详见 requirements.txt 注释），不要用 conda-forge 构建，
#   否则会与 torch 的 DLL 搜索路径冲突。
name: checkin_detection
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.10
  - pip
  - pip:
    # 核心
    - torch==2.11.0
    - torchvision==0.26.0
    - numpy==2.2.5
    - pandas==2.3.3
    - Pillow==12.3.0
    - tqdm==4.67.3
    # 视觉编码器
    - timm==1.0.28
    - safetensors==0.8.0
    - transformers==4.57.6
    - git+https://github.com/openai/CLIP.git
    # 报告生成
    - python-docx==1.2.0
